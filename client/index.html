<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>route client</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: .25rem .5rem; text-align: left; }
    .error { color: #b00; }
  </style>
</head>
<body ng-app="routeApp" ng-controller="MarketsController as vm">
  <h1>route client</h1>
  <p>
    market data from <code>/markets.json</code>;
    proof from <code>/proof/{sha}</code>.
  </p>
  <p><button ng-click="vm.refresh()">refresh</button></p>
  <p class="error" ng-show="vm.error">{{ vm.error }}</p>
  <table>
    <thead><tr><th>#</th><th>market</th></tr></thead>
    <tbody>
      <tr ng-repeat="m in vm.markets track by $index">
        <td>{{ $index + 1 }}</td>
        <td><code>{{ m | json }}</code></td>
      </tr>
    </tbody>
  </table>
  <script src="node_modules/angular/angular.js"></script>
  <script src="app.js"></script>
</body>
</html>
