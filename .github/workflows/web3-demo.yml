name: Web3 demo promotion

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  justitia-and-plasma-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tronmail/package-lock.json

      - name: Test resource router payload
        working-directory: tronmail
        run: |
          npm ci
          npm test
          npm run test:plasma-game

      - name: Validate Tronmail contract sources
        run: |
          test -s tronmail/contracts/TokenWrapper.sol
          test -s tronmail/contracts/TriggerEvent.sol
          test -s tronmail/contracts/CrossFundsPool.sol
          test -s tronmail/contracts/HorseMonkey.sol
          test -s tronmail/contracts/FibonacciPlasma.sol
          python3 -m json.tool tronmail/deployment-result.json >/dev/null
          python3 -m py_compile tronmail/deploy.py tronmail/publish_result.py tronmail/actionkv.py

      - name: Validate migration sources
        run: |
          grep -q 'ONE block' tronmail/deploy.py
          grep -q 'action KV' tronmail/deploy.py
          grep -q 'TAUVq7fdL6usuP6ZK4Vpnp8ZfkUu4yAVKj' tronmail/publish_result.py

      - name: Publish deployment result metadata
        run: |
          python3 tronmail/publish_result.py \
            --commit '${{ github.sha }}' \
            --migration-block 19 \
            --output deployment-result.json

      - name: Publish dev fork batch artifact
        if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web3-demo-dev-batch-${{ github.sha }}
          path: |
            tronmail/deployment-result.json
            tronmail/contracts/TokenWrapper.sol
            tronmail/contracts/TriggerEvent.sol
            tronmail/contracts/CrossFundsPool.sol
            tronmail/contracts/HorseMonkey.sol
            tronmail/resource_trigger.js
            tronmail/resource_trigger.test.js
            tronmail/fibonacci_plasma_test.py
            tronmail/contracts/FibonacciPlasma.sol
            tronmail/route-5000-usdt-result.json
            tronmail/approve-5000-usdt-result.json
            tronmail/router-trigger-result.json
            deployment-result.json
          if-no-files-found: error

      - name: Publish main release artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web3-demo-release-${{ github.sha }}
          path: |
            tronmail/deployment-result.json
            tronmail/contracts/TokenWrapper.sol
            tronmail/contracts/TriggerEvent.sol
            tronmail/contracts/CrossFundsPool.sol
            tronmail/contracts/HorseMonkey.sol
            tronmail/resource_trigger.js
            tronmail/resource_trigger.test.js
            tronmail/fibonacci_plasma_test.py
            tronmail/contracts/FibonacciPlasma.sol
            tronmail/route-5000-usdt-result.json
            tronmail/approve-5000-usdt-result.json
            tronmail/router-trigger-result.json
            deployment-result.json
          if-no-files-found: error
