name: route

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

concurrency:
  group: route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/route
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: workspace/route/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - run: go build -o bin/route ./cmd/route
      - run: ./bin/route audit

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        with:
          name: runner-jacoco
          path: workspace/runner/target/site/jacoco

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/client
    env:
      ROUTE_SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/client/package-lock.json
      - run: npm ci
      - run: npm test
